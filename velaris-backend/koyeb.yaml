name: velaris-backend
services:
  - name: api
    type: web
    git:
      repository: github.com/velaroxsolutions/velaris
      branch: master
    build:
      buildpack:
        build_command: pip install -r requirements.txt
    run: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    routes:
      - path: /
        port: 8000
    env:
      - key: FIREBASE_CREDENTIALS_BASE64
        value: 
    root_directory: velaris-backend